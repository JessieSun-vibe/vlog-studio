# 在没有的电脑上替我们跑一遍：Windows、Intel Mac、Linux、Apple 芯片 Mac
# 检查自检脚本、语音转写（自动选引擎）、停顿分析能不能跑通。
name: cross-platform

on:
  push:
    paths: ["plugin/skills/vlog-studio/scripts/**", ".github/workflows/cross-platform.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "0"   # 故意不开 UTF-8 模式，确认脚本自己处理好了中文编码
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: 自检
        run: uv run --python 3.12 python plugin/skills/vlog-studio/scripts/doctor.py || true
      - name: 测试音频
        run: curl -fsSL -o jfk.flac https://raw.githubusercontent.com/SYSTRAN/faster-whisper/master/tests/data/jfk.flac
      - name: 转写（自动选引擎）
        run: uv run plugin/skills/vlog-studio/scripts/transcribe.py work jfk.flac --lang en --prompt "测试，巴厘岛"
      - name: 检查转写结果
        run: |
          uv run --python 3.12 python - <<'EOF'
          import json
          r = json.load(open("work/transcripts/jfk.json", encoding="utf-8"))
          words = [w for s in r["segments"] for w in s["words"]]
          print(r["engine"], len(words), "words:", r["text"])
          assert len(words) > 10 and "country" in r["text"].lower()
          assert all(w["end"] >= w["start"] for w in words)
          EOF
      - name: 停顿分析
        run: uv run --python 3.12 python plugin/skills/vlog-studio/scripts/clean_speech.py report work/transcripts/jfk.json work/transcripts/jfk_16k.wav
